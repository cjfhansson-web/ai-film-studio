name: Deploy isolated AI Director test Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-film-studio-director-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/utveckling/videoanalys-20'
    runs-on: ubuntu-latest
    environment: director-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test Worker target
        run: |
          grep -Fx 'name = "ai-film-studio-director-test"' wrangler.toml
          grep -Fx 'main = "worker.js"' wrangler.toml
          if grep -q 'name = "ai-film-studio-api"' wrangler.toml; then exit 1; fi
      - name: Run offline director tests
        run: node --test director-api.test.mjs
      - name: Check Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo 'Missing CF_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CF_ACCOUNT_ID'; exit 1; }
      - name: Deploy test Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.toml --name ai-film-studio-director-test

# Configure CF_API_TOKEN and CF_ACCOUNT_ID as GitHub Actions secrets.
# Configure OPENAI_API_KEY and STUDIO_ACCESS_TOKEN separately as Cloudflare
# runtime secrets on ai-film-studio-director-test. Never copy their values to git.
# This workflow is manually dispatched from the development branch only.
